name: Microservices CI Pipeline

# 1. TRIGGER: Khi nào robot GitHub Actions được kích hoạt?
on:
  push:
    branches: [ "main" ] # Chạy khi push vào nhánh main
  pull_request:
    branches: [ "main" ] # Chạy khi có ai đó mở Pull Request vào main
  workflow_dispatch:      # Cho phép bấm nút "Run workflow" thủ công trên giao diện GitHub

# 2. JOBS: Tập hợp các công việc cần làm
jobs:
  build-and-compile:
    name: Build & Package All Services
    runs-on: ubuntu-latest # GitHub cấp miễn phí 1 máy ảo Ubuntu mới tinh

    steps:
      # Bước 1: Kéo toàn bộ source code từ GitHub về máy ảo
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Bước 2: Cài đặt môi trường Java 17 trên máy ảo Ubuntu
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven # Tự động cache thư viện Maven để lần sau build siêu nhanh

      # Bước 3: Biên dịch và đóng gói toàn bộ 5 microservices
      - name: Build with Maven
        run: |
          echo "Bắt đầu build toàn bộ hệ thống..."
          mvn clean package -DskipTests

      # Bước 4: Kiểm tra kết quả các file JAR sau khi build xong
      - name: Verify Built Artifacts
        run: |
          echo "Danh sách các file JAR đã được build thành công:"
          ls -lh */target/*.jar
