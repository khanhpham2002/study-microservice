name: Microservices CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-compile:
    name: Build & Package All Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          echo "Bắt đầu build toàn bộ hệ thống..."
          mvn clean package -DskipTests

      - name: Verify Built Artifacts
        run: |
          echo "Danh sách các file JAR đã được build thành công:"
          ls -lh */target/*.jar
